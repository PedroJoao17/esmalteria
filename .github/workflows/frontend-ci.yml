name: Frontend CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json não encontrado no checkout; usando npm install para validar a branch."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
